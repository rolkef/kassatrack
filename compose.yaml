services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kassatrack
      POSTGRES_PASSWORD: kassatrack
      POSTGRES_DB: kassatrack
    ports:
      - "5432:5432"
    volumes:
      - postgres-daten:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nur für Tests. Daten liegen im RAM und sind nach dem Stoppen weg —
  # das ist gewollt und macht die Testläufe schnell.
  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kassatrack
      POSTGRES_PASSWORD: kassatrack
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-daten:
